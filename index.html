<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Video</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 360px;
    background: #eeeeee;
    padding: 10px;
    border: 1px solid #aaa;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
}

/* VIDEO LINK */

.video-link {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
}

.video-link input {
    flex: 1;
    height: 40px;
    padding: 8px;
    border: 1px solid #aaa;
    font-size: 13px;
    outline: none;
}

.video-link button {
    height: 40px;
    padding: 0 12px;
    border: 1px solid #777;
    background: #2196f3;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.video-link button:hover {
    background: #1976d2;
}

/* DISPLAY */

.display {
    width: 100%;
    height: 65px;
    background: white;
    border: 1px solid #aaa;
    margin-bottom: 10px;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
}

.display span {
    font-size: 30px;
    color: #111;
}

/* BUTTONS */

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
}

button {
    height: 55px;
    border: 1px solid #aaa;
    background: #f5f5f5;
    font-size: 22px;
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

button:active {
    transform: scale(.97);
}

.operator {
    background: #ff9800;
    color: white;
}

.operator:hover {
    background: #f57c00;
}

.equals {
    background: #4caf50;
    color: white;
}

.equals:hover {
    background: #388e3c;
}

.clear {
    background: #ff513f;
    color: white;
}

.delete {
    background: #607d8b;
    color: white;
}

.bottom {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 5px;
    margin-top: 5px;
}

/* VIDEO POPUP */

.video-popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.88);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.video-box {
    position: relative;
    width: min(92%, 850px);
    background: #000;
    padding: 5px;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(255,255,255,.2);
    animation: popup .3s ease;
}

.video-box video {
    width: 100%;
    max-height: 85vh;
    display: block;
    border-radius: 8px;
}

.close-video {
    position: absolute;
    right: -16px;
    top: -16px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
}

.close-video:hover {
    background: #ddd;
}

@keyframes popup {
    from {
        transform: scale(.6);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}
</style></head><body><div class="calculator"><!-- VIDEO LINK -->
<div class="video-link">
    <input
        type="text"
        id="videoURL"
        placeholder="Paste video link here..."
    >

    <button onclick="saveVideo()">Save</button>
</div>

<!-- DISPLAY -->
<div class="display">
    <span id="display">0</span>
</div>

<!-- CALCULATOR -->
<div class="buttons">

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="operator('/')">/</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="operator('*')">*</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="operator('-')">-</button>

    <button onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>

    <!-- EQUAL BUTTON OPENS VIDEO -->
    <button class="equals" onclick="calculate()">=</button>

    <button class="operator" onclick="operator('+')">+</button>

</div>

<div class="bottom">
    <button class="clear" onclick="clearCalculator()">C</button>
    <button class="delete" onclick="deleteNumber()">⌫</button>
    <div></div>
</div>

</div><!-- VIDEO POPUP --><div class="video-popup" id="videoPopup"><div class="video-box">

    <button class="close-video" onclick="closeVideo()">×</button>

    <video
        id="popupVideo"
        controls
        playsinline>
    </video>

</div>

</div><script>

/* ==============================
   CALCULATOR
============================== */

let current = "";
let previous = "";
let selectedOperator = null;
let resetDisplay = false;

const display = document.getElementById("display");


/* ==============================
   YOUR VIDEO
============================== */

let savedVideo = "ianian.mp4";


/* ==============================
   DISPLAY
============================== */

function updateDisplay() {
    display.textContent = current || "0";
}


/* ==============================
   NUMBERS
============================== */

function number(num) {

    if (resetDisplay) {
        current = "";
        resetDisplay = false;
    }

    if (current === "0") {
        current = num;
    } else {
        current += num;
    }

    updateDisplay();
}


/* ==============================
   DECIMAL
============================== */

function decimal() {

    if (resetDisplay) {
        current = "";
        resetDisplay = false;
    }

    if (!current.includes(".")) {

        if (current === "") {
            current = "0.";
        } else {
            current += ".";
        }
    }

    updateDisplay();
}


/* ==============================
   OPERATOR
============================== */

function operator(op) {

    if (current === "" && previous === "") {
        return;
    }

    if (previous !== "" && current !== "") {
        calculate(false);
    }

    previous = current;
    current = "";
    selectedOperator = op;
}


/* ==============================
   CALCULATE
============================== */

function calculate(showVideo = true) {

    if (
        previous !== "" &&
        current !== "" &&
        selectedOperator
    ) {

        const a = parseFloat(previous);
        const b = parseFloat(current);

        let result;

        switch (selectedOperator) {

            case "+":
                result = a + b;
                break;

            case "-":
                result = a - b;
                break;

            case "*":
                result = a * b;
                break;

            case "/":

                if (b === 0) {

                    display.textContent = "Error";

                    current = "";
                    previous = "";
                    selectedOperator = null;

                    return;
                }

                result = a / b;
                break;
        }

        result = Number(result.toFixed(10));

        current = String(result);
        previous = "";
        selectedOperator = null;
        resetDisplay = true;

        updateDisplay();
    }


    /* OPEN VIDEO WHEN = IS CLICKED */

    if (showVideo) {
        openVideo();
    }
}


/* ==============================
   SAVE ANOTHER VIDEO LINK
============================== */

function saveVideo() {

    const input =
        document.getElementById("videoURL");

    const url = input.value.trim();

    if (!url) {

        alert("Please paste a video link.");

        return;
    }

    savedVideo = url;

    alert("Video saved!");

}


/* ==============================
   OPEN VIDEO
============================== */

function openVideo() {

    const popup =
        document.getElementById("videoPopup");

    const video =
        document.getElementById("popupVideo");


    /* USE YOUR SAVED VIDEO */

    video.src = savedVideo;

    video.load();

    popup.style.display = "flex";

    video.currentTime = 0;


    /* PLAY */

    video.play().catch(function() {

        console.log(
            "Autoplay blocked. Press play."
        );

    });
}


/* ==============================
   CLOSE VIDEO
============================== */

function closeVideo() {

    const popup =
        document.getElementById("videoPopup");

    const video =
        document.getElementById("popupVideo");

    video.pause();

    video.currentTime = 0;

    popup.style.display = "none";
}


/* ==============================
   CLEAR
============================== */

function clearCalculator() {

    current = "";
    previous = "";
    selectedOperator = null;
    resetDisplay = false;

    updateDisplay();
}


/* ==============================
   DELETE
============================== */

function deleteNumber() {

    if (resetDisplay) {

        current = "";
        resetDisplay = false;

    } else {

        current =
            current.slice(0, -1);

    }

    updateDisplay();
}


/* ==============================
   CLOSE WHEN CLICKING OUTSIDE
============================== */

document
.getElementById("videoPopup")
.addEventListener("click", function(event) {

    if (event.target === this) {
        closeVideo();
    }

});


/* ==============================
   KEYBOARD
============================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key = event.key;

        if (!isNaN(key)) {
            number(key);
        }

        if (key === ".") {
            decimal();
        }

        if (
            ["+", "-", "*", "/"]
            .includes(key)
        ) {
            operator(key);
        }

        if (
            key === "Enter" ||
            key === "="
        ) {
            calculate();
        }

        if (key === "Backspace") {
            deleteNumber();
        }

        if (
            key === "Escape" ||
            key.toLowerCase() === "c"
        ) {
            clearCalculator();
        }

    }
);

</script></body>
</html>
